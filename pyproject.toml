[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-crash-risk-forecast"
version = "0.1.0"
description = "Empirical Bayes network screening of NYC pedestrian casualty risk, backtested against DOT's published Vision Zero priority list"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jeffrey De La Cruz" }]

dependencies = [
    "pandas>=2.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Jeffreys-World/nyc-crash-risk-forecast"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a live Socrata API; deselect with -m 'not network'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
